[project]
name = "analyzer"
version = "v1"
description = "Скрипт для составления отчета о брендах. Сортирует компании по рейтингу"
authors = [
    {name = "Pavel"}
]
license = {text = "PG"}
readme = "README.md"
requires-python = "3.12"
dependencies = [
    "tabulate (>=0.9.0,<0.10.0)"
]

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
